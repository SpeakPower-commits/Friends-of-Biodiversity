<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Observe">
  <style>
    .ring{transform-origin:32px 44px;animation:ripple 2.4s ease-out infinite}
    .ring2{animation-delay:1.2s}
    @keyframes ripple{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
    .drop{animation:drop 2.4s ease-in-out infinite}
    @keyframes drop{0%,100%{transform:translateY(0)}45%{transform:translateY(3px)}}
  </style>
  <circle cx="32" cy="32" r="31" fill="#2E4A34"/>
  <ellipse cx="32" cy="44" rx="14" ry="5" fill="none" stroke="#97BC62" stroke-width="2" class="ring"/>
  <ellipse cx="32" cy="44" rx="14" ry="5" fill="none" stroke="#97BC62" stroke-width="2" class="ring ring2"/>
  <g class="drop">
    <path d="M32 14c-6 0-11 5-11 11 0 8 11 19 11 19s11-11 11-19c0-6-5-11-11-11Z" fill="#EFCF9E"/>
    <circle cx="32" cy="25" r="4.4" fill="#2E4A34"/>
  </g>
</svg>
