<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Evidence">
  <style>
    .b{transform-origin:center bottom;animation:grow 2.8s ease-in-out infinite}
