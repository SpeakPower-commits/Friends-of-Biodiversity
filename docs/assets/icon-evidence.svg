  </style>
  <circle cx="32" cy="32" r="31" fill="#2E4A34"/>
  <rect x="17" y="30" width="8" height="18" rx="2" fill="#97BC62" class="b"/>
  <rect x="28" y="22" width="8" height="26" rx="2" fill="#EFCF9E" class="b b2"/>
  <rect x="39" y="26" width="8" height="22" rx="2" fill="#97BC62" class="b b3"/>
  <path d="M15 50h34" stroke="#EFCF9E" stroke-width="2.2" stroke-linecap="round"/>
</svg>
